[package]
name = "multimusic"
version = "0.9.5"
edition = "2021"
description = "A fast, lightweight, native music player for local files, Spotify and SoundCloud"
license = "MIT"
rust-version = "1.88"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts"] }
egui = "0.36"
egui-phosphor = { version = "0.14", features = ["regular", "fill"] }
librespot-core = { version = "0.8", default-features = false, features = ["native-tls"] }
librespot-playback = { version = "0.8", default-features = false, features = ["rodio-backend", "native-tls"] }
librespot-protocol = "0.8"
# Saving Spotify songs: the file and its key the way the player gets them, and the song's files.
librespot-audio = { version = "0.8", default-features = false, features = ["native-tls"] }
librespot-metadata = { version = "0.8", default-features = false, features = ["native-tls"] }
protobuf = "3"
http = "1"
lofty = "0.25"
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "charset", "gzip", "json", "form", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process", "fs"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
walkdir = "2"
plist = "1"
directories = "6"
md-5 = "0.10"
regex = "1"
toml = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
discord-rich-presence = "1"
rand = "0.9"
open = "5"
urlencoding = "2"
libc = "0.2"
memmap2 = "0.9"
sha2 = "0.10"
base64 = "0.22"
futures-util = "0.3"
raw-window-handle = "0.6"
# The media server's peer protocol (src/hub): X25519 keys, signed requests, sealed logins.
x25519-dalek = { version = "2", features = ["static_secrets"] }
aes-gcm = "0.10"
hmac = "0.12"
data-encoding = "2"
hex = "0.4"
socket2 = { version = "0.6", features = ["all"] }

# Desktops draw with OpenGL; iOS has no OpenGL to speak of, so the iPhone app draws with Metal
# (through wgpu).
[target.'cfg(not(target_os = "ios"))'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "wayland", "x11"] }

# iOS: mpv can't run there (an app may not start other programs), so local files and
# SoundCloud streams play through rodio and symphonia inside the app.
[target.'cfg(target_os = "ios")'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["wgpu"] }
# The audio session and the lock screen's Now Playing, through plain Objective-C messages.
objc2 = "0.6"
block2 = "0.6"
rodio = { version = "0.21", default-features = false, features = ["playback", "symphonia-mp3", "symphonia-flac", "symphonia-vorbis", "symphonia-ogg", "symphonia-wav", "symphonia-aiff", "symphonia-pcm", "symphonia-aac", "symphonia-isomp4", "symphonia-alac"] }

# Windows and macOS: their media overlays and keys (souvlaki), and their file pickers (rfd).
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
souvlaki = { version = "0.8", default-features = false }
rfd = { version = "0.15", default-features = false }
pollster = "0.4"

# Linux: media controls (MPRIS), notifications and the file picker portal over D-Bus.
[target.'cfg(not(any(windows, target_os = "macos", target_os = "ios")))'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Time",
] }

[dev-dependencies]
tempfile = "3"

[features]
default = ["pulseaudio"]
# Spotify output through PulseAudio / PipeWire (pipewire-pulse). Without it Spotify
# plays through ALSA only.
pulseaudio = ["librespot-playback/pulseaudio-backend"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev.package."*"]
opt-level = 2

# librespot-core's sysinfo doesn't build for iOS; see patches/sysinfo/Cargo.toml.
[patch.crates-io]
sysinfo = { path = "patches/sysinfo" }
